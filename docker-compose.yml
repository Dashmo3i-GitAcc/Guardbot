# One image, two processes.
#
# The bot and the Admin Control Center run from the *same* image, built once
# from this repository: same base, same system packages, same bot requirements,
# plus the panel's own two (see requirements-dashboard.txt). The dashboard is
# not a second image and not a second stack — it is a second `command` over the
# same layers, which is what keeps the extra disk cost of the panel at roughly
# nothing. The name is declared once here and referenced by both services.
x-guardbot-image: &guardbot_image guardbot:latest

services:
  guardbot:
    build: .
    image: *guardbot_image
    container_name: guardbot
    restart: always
    env_file: .env
    volumes:
      - ./data:/data          # sqlite db

    # A log ceiling, because the default is none.
    #
    # `json-file` with no `max-size` grows until the disk is full, and this
    # container logs a line per moderated message. The host is a 20 GB root
    # volume that already runs at 86%; an unbounded log on it is a slow-motion
    # outage, and it is the kind that arrives at the worst moment.
    #
    # 10 MB x 3 files = a 30 MB ceiling. A day of moderation fits in that many
    # times over, so nothing an operator needs to read is lost.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Host networking, on purpose.
    #
    # The VPN bot is a systemd service on the host, not part of this compose
    # project, so this container has to reach a process outside Docker. The
    # obvious way — `extra_hosts: host.docker.internal:host-gateway` and then
    # connect to the bridge gateway — does not work on this host: the gateway
    # address is the host itself, so the packet lands on the host's INPUT
    # chain, and ufw's default-deny drops it (the firewall allow-list carries
    # only the service ports). The connection does not fail fast either, it
    # times out, which reads like the VPN bot being down.
    #
    # Sharing the host's network namespace makes the VPN bot reachable on
    # 127.0.0.1:8099 instead, where nothing has to be opened to the outside.
    # The internal API is bound to loopback to match (INTERNAL_API_HOST in
    # /opt/vpn-bot/.env) — see /opt/vpn-bot/AGENTS.md §13.9.
    #
    # If you would rather keep the container on a bridge network, the flow
    # also works over the gateway address, but the host firewall must allow
    # the Docker bridge range to reach the port:
    #     ufw allow from 172.16.0.0/12 to any port 8099 proto tcp
    # and INTERNAL_API_HOST must go back to 0.0.0.0.
    #
    # Nothing is published either way; the bot only makes outbound connections.
    network_mode: host

    deploy:
      resources:
        limits:
          memory: 2g

  # ── The Admin Control Center ───────────────────────────────────────────────
  #
  # The same image as the bot, run with a different command. It is a separate
  # *process*, never a thread inside the bot: a problem in the web layer (a bad
  # route, a slow query, an out-of-memory page) must not be able to disturb
  # Telegram polling, and the two can be restarted independently.
  dashboard:
    build: .
    image: *guardbot_image
    container_name: guardbot-dashboard
    restart: always
    env_file: .env
    # The same volume, read and written through the same code paths the bot
    # uses. There is no second database and no second data directory — a copy
    # would drift, and the panel's whole point is to show the real state.
    volumes:
      - ./data:/data
    # `python -m app.web` binds 127.0.0.1:8100 by default (DASHBOARD_HOST/PORT),
    # which is why this service needs the host's network namespace: the port is
    # meant to be reached by the reverse proxy on the host, and by nothing else.
    # Nothing is published to the internet by this file; TLS and the firewall
    # are the proxy's job (ops/nginx-dashboard.conf.example).
    command: ["python", "-m", "app.web"]
    network_mode: host
    depends_on:
      - guardbot

    # A liveness probe that uses the image's own interpreter — the slim base
    # has no curl, and adding one for a health check would be a package in the
    # image for a single request.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # The same log ceiling as the bot. The dashboard logs far less, but "far
    # less" is not a bound: an unbounded json-file log on a volume that already
    # runs above 85% is a slow-motion outage.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: 512m
